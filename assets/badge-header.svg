<svg xmlns="http://www.w3.org/2000/svg" width="320" height="188" viewBox="0 0 320 188">
<defs>
<linearGradient id="ringfill" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#4fd7ff" stop-opacity="0.22"/>
<stop offset="100%" stop-color="#b26bff" stop-opacity="0.22"/>
</linearGradient>
<filter id="circGlow" x="-80%" y="-80%" width="260%" height="260%">
<feGaussianBlur stdDeviation="7" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="textGlow" x="-60%" y="-60%" width="220%" height="220%">
<feGaussianBlur stdDeviation="3.2" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>

<circle cx="160" cy="74.0" r="54.0" fill="url(#ringfill)" stroke="#7fcfff" stroke-width="1.6" opacity="0.55" filter="url(#circGlow)"/>
<circle cx="160" cy="74.0" r="54.0" fill="url(#ringfill)" stroke="#9fdcff" stroke-width="1.6"/>

<text x="160" y="84.2" text-anchor="middle" font-family="Chakra Petch, Arial, sans-serif" font-weight="700" font-size="30" fill="#eaf6ff">PS</text>

<text x="160" y="160.0" text-anchor="middle" font-family="Chakra Petch, Arial, sans-serif" font-weight="700" font-size="30" fill="#f6f9ff" filter="url(#textGlow)">Pedro Santos</text>
</svg>
